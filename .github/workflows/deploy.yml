name: Check & deploy

# Branch → environment (checked again on the server):
#   staging → staging     (automatic after the checks pass)
#   main    → production  (waits for approval when the "production" environment has required reviewers)
# Pull requests run the checks only.
on:
    push:
        branches: [main, staging]
    pull_request:
    workflow_dispatch:

concurrency:
    group: deploy-web-${{ github.ref_name }}
    cancel-in-progress: false

jobs:
    check:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci --no-audit --no-fund
            - name: Types
              run: npm run typecheck
            - name: Lint
              run: npm run lint
            - name: Format
              run: npm run format:check
            - name: Build
              run: npm run build
              env:
                  NEXT_TELEMETRY_DISABLED: 1

    deploy:
        needs: check
        if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'staging')
        runs-on: ubuntu-24.04
        environment:
            name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
        steps:
            - name: Deploy to ${{ github.ref_name == 'main' && 'production' || 'staging' }}
              uses: appleboy/ssh-action@v1
              env:
                  DEPLOY_ACTOR: ${{ github.actor }} (GitHub Actions)
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  command_timeout: 30m
                  envs: DEPLOY_ACTOR
                  script: |
                      if [ "${{ github.ref_name }}" = main ]; then
                        bash /opt/engage/backend/deploy/deploy.sh web
                      else
                        bash /opt/engage-staging/backend/deploy/deploy.sh --env staging web
                      fi
